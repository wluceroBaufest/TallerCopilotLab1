[tool.poetry]
name = "backend"
version = "1.0.0"
description = "FastAPI WebAPI with JWT authentication"
authors = ["Developer"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
pydantic = "^2.11.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
